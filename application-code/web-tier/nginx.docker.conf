# Container-specific nginx config (the original nginx.conf targets the EC2
# deployment path from the workshop and is left untouched for that use case).
worker_processes auto;
error_log /dev/stderr;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;

        location /health {
            default_type text/html;
            return 200 "<!DOCTYPE html><p>Web Tier Health Check</p>\n";
        }

        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri /index.html;
        }

        # Points at the app-tier Kubernetes/ECS service name or internal LB
        # DNS -- set via env/templating in your deployment manifests.
        location /api/ {
            proxy_pass http://app-tier:4000/;
        }
    }
}
