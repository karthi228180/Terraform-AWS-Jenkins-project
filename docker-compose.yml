# For local development only -- not used by the Jenkins pipeline.
version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: webappdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - ./application-code/app-tier/schema.postgresql.sql:/docker-entrypoint-initdb.d/init.sql

  app-tier:
    build: ./application-code/app-tier
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PWD: localdevpassword
      DB_DATABASE: webappdb
      DB_SSL: "false"
    ports:
      - "4000:4000"

  web-tier:
    build: ./application-code/web-tier
    depends_on:
      - app-tier
    ports:
      - "8080:8080"
